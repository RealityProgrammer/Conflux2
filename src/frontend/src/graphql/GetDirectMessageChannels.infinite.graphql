query GetDirectMessageChannels($after: String) {
    directMessageConversations(
        after: $after
        order: { latestMessageAt: DESC }
    ) {
        pageInfo {
            hasNextPage
            hasPreviousPage
            endCursor
        }

        nodes {
            id
            peerUser {
                id
                avatarRevision
                displayName
                userName
                effectivePresenceStatus
            }
        }
    }
}