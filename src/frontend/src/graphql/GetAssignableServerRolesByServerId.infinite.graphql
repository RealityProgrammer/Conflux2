query GetAssignableServerRolesByServerId($serverId: UUID!, $nameFilter: String, $after: String) {
    communityServerRolesByServerId(
        serverId: $serverId,
        after: $after,
        where: {
            name: { ilike: $nameFilter }
            specialRoleType: { eq: None }
        }
    ) {
        pageInfo {
            endCursor
            hasNextPage
        }

        nodes {
            id
            name
        }
    }
}