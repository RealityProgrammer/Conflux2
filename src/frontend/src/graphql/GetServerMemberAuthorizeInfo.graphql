query GetServerMemberAuthorizeInfo($serverId: UUID!, $userId: UUID!) {
    communityServerMemberByServerAndUserId(serverId: $serverId, userId: $userId) {
        id
        authorizeInfo {
            authorizeLevel
            permissions {
                permission
                isGranted
            }
            isBanned
        }
        roles {
            id
        }
    }
}