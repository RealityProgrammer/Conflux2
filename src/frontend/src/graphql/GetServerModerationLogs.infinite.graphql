query GetServerModerationLogs($serverId: UUID!, $after: String) {
    serverModerationLogs(
        serverId: $serverId
        after: $after
    ) {
        pageInfo {
            endCursor
            hasNextPage
        }

        nodes {
            id
            executorMember {
                user {
                    id
                    displayName
                    hasAvatar
                }
            }
            action
            affectedMember {
                user {
                    id
                    displayName
                    hasAvatar
                }
            }
            createdAt
            banDuration
            reason
        }
    }
}