services:
  valkey:
    container_name: Conflux_Valkey
    image: valkey/valkey:9.1.1-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "password"]

  database:
    container_name: Conflux_Database
    image: postgres:18.4-alpine3.24
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "conflux"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres", "-d", "conflux"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 5s

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: Conflux_Garage
    profiles:
      - garage
    ports:
      - "3900:3900"
      - "3902:3902"
    env_file:
      - "./garage/.env"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
    command: ["/garage", "-c", "/etc/garage.toml", "server"]

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: Conflux_Backend
    ports:
      - "5127:5127"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5127"
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Database: "Host=Conflux_Database;Port=5432;Database=conflux;Username=postgres;Password=password;Include Error Detail=true;Pooling=true;"
      ConnectionStrings__Valkey: "Conflux_Valkey:6379,abortConnect=false,password=password"      
      Frontend__Origin: "http://localhost:5173"
      S3__ServiceURL: "http://Conflux_Garage:3900"
      S3__PreSignUrl: "http://localhost:3900"
      S3__UseHttps: false
      Services__Auth__AccessTokenDuration: 900
      Services__Auth__RefreshTokenDuration: 604800
      Services__User__MaxAvatarSizeBytes: 1048576
      Services__Messaging__MaxAttachmentSizeBytes: 10485760
    env_file:
      - "./src/backend/Conflux.WebApi/.env"
    depends_on:
      database:
        condition: service_healthy
      valkey:
        condition: service_started

volumes:
  valkey-data:
  postgres-data:
  garage-data:
  garage-meta:
